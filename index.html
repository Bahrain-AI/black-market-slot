<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>The Black Market</title><link rel="stylesheet" href="style.css"></head><body>
<div id="game"><div class="ambient"></div><header><img src="assets/logo.png" class="logo"><div class="tag">RARE ITEMS<br>BIGGER STORIES</div></header>
<aside class="left-note">BUY<br>SPIN<br>STEAL<br>REPEAT</aside><aside class="right-note">SOME<br>DEALS<br>SHOULD<br>STAY<br>HIDDEN</aside>
<main><div id="reels" class="reels"></div><div id="message" class="message"></div></main>
<section class="lot"><img src="assets/artifact.png"><span>LOT 001</span></section>
<div class="hud"><button id="menu">☰</button><div><small>BALANCE</small><b id="balance">$991.30</b></div><button id="minus">−</button><div><small>BET</small><b id="bet">$1.00</b></div><button id="plus">+</button><div><small>WIN</small><b id="win">$0.00</b></div><button id="spin" class="spin">↻</button><button id="auto">↻ AUTOPLAY</button><button id="turbo">⚡ TURBO</button></div>
<div id="panel" class="panel"><h2>THE BLACK MARKET</h2><p>Match 3+ identical items horizontally or vertically. WILD substitutes for all regular items.</p><button id="close">CLOSE</button></div></div><script src="game.js"></script></body></html>
