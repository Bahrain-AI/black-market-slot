<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#1a1612">
  <title>BLACK MARKET — by GRIND.</title>
  <link rel="icon" href="data:,">
  <meta name="description" content="BLACK MARKET — a premium slot concept by GRIND. Distinct by Design.">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="stage" id="stage">
    <!-- Reference background -->
    <img class="ref-bg" src="./assets/black-market-reference.webp" alt="">

    <!-- Reel grid overlay -->
    <div class="reel-grid" id="reelGrid">
      <!-- 20 cells will be injected here -->
    </div>

    <!-- Bottom HUD (smoked translucent bar) -->
    <div class="hud" id="hud">
      <button class="btn menu" id="btnMenu" aria-label="Menu">≡</button>
      <div class="metric" id="metricBalance">
        <span class="label">BALANCE</span>
        <span class="value" id="balance">$991.30</span>
      </div>
      <button class="btn minus" id="btnMinus" aria-label="Decrease bet">−</button>
      <div class="metric" id="metricBet">
        <span class="label">BET</span>
        <span class="value" id="bet">$1.00</span>
      </div>
      <button class="btn plus" id="btnPlus" aria-label="Increase bet">+</button>
      <button class="btn spin" id="btnSpin" aria-label="Spin">↻</button>
      <button class="btn autoplay" id="btnAutoplay" aria-label="Autoplay">AUTOPLAY</button>
      <button class="btn turbo" id="btnTurbo" aria-label="Turbo">TURBO</button>
    </div>

    <!-- Win message -->
    <div class="message" id="message"></div>
  </div>

  <!-- Menu modal -->
  <section class="modal" id="modal" aria-hidden="true">
    <div class="modal-content">
      <button class="modal-close" id="modalClose" aria-label="Close">×</button>
      <h2>BLACK MARKET</h2>
      <p>This public build is an audience demo. It uses local demo outcomes only. Production outcomes will be supplied by the Stake Engine RGS and approved math package.</p>
      <div class="rule-grid">
        <div><small>FORMAT</small><b>5 × 4</b></div>
        <div><small>TARGET RTP</small><b>96.00%</b></div>
        <div><small>MAX WIN TARGET</small><b>5,000×</b></div>
        <div><small>PROVIDER</small><b>GRIND.</b></div>
      </div>
    </div>
  </section>

  <script src="./game.js"></script>
</body>
</html>
